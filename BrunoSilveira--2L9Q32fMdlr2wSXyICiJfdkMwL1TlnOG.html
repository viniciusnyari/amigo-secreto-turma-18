<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Amigo Secreto</title><style>body{font-family:system-ui,sans-serif;background:#f4f6f9;display:grid;place-items:center;min-height:100vh;margin:0;color:#243044}.card{background:white;max-width:460px;margin:20px;padding:35px;border-radius:20px;box-shadow:0 10px 30px #0001;text-align:center}button{background:#245c50;color:white;border:0;padding:15px 24px;border-radius:10px;font-size:17px;cursor:pointer}.secret{display:none;font-size:28px;font-weight:700;color:#245c50;margin:24px 0}small{color:#667085}</style></head><body><main class="card"><h1>🎁 Amigo Secreto</h1><p>Olá, <strong>Bruno Silveira</strong>!</p><p>Seu sorteio está pronto. Clique abaixo para descobrir quem você tirou.</p><button id="reveal">Revelar meu amigo secreto</button><div id="secret" class="secret">Eduardo Bugs</div><p><small>Este link é pessoal. Não o compartilhe.</small></p></main><script>document.getElementById('reveal').addEventListener('click',()=>{document.getElementById('secret').style.display='block';document.getElementById('reveal').style.display='none'})</script></body></html>
